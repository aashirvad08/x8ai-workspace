[package]
name = "x8ai-mcp"
description = "MCP servers: the registry, approvals, environment policy, and session-owned stdio server processes behind a private socket. No Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
x8ai-core.workspace = true
x8ai-workspace.workspace = true
x8ai-secrets.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `socket`: the peer process of a connection to a server's socket (LOCAL_PEERPID
# on macOS, SO_PEERCRED on Linux), so only the session's agent can use it.
nix = { workspace = true, features = ["signal", "socket"] }

[dev-dependencies]
tempfile.workspace = true
# The live test (ignored by default) runs a real agent with a server.
x8ai-agents.workspace = true
x8ai-providers.workspace = true
x8ai-pty.workspace = true

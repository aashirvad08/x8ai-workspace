[package]
name = "x8ai-pty"
description = "PTY sessions: the user's shell on a pseudo-terminal, with streamed output and lifecycle management. No Tauri."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
x8ai-core.workspace = true
portable-pty.workspace = true
nix.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# The user's language and region, to set LANG as macOS terminals do (see locale.rs).
sys-locale = "0.3"

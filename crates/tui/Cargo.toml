[package]
name = "x8ai"
description = "x8ai Workspace in the terminal: the `x8ai` command, a full-screen program that hosts the same spaces and shells as the desktop app. No Tauri."
# Released on its own: a tag v<version> publishes it (.github/workflows/release.yml).
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "x8ai"
path = "src/main.rs"

[dependencies]
x8ai-core.workspace = true
x8ai-pty.workspace = true
x8ai-workspace.workspace = true
ratatui.workspace = true
alacritty_terminal.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width = "0.2"
# The account's full name, for the greeting, from the user database.
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
tempfile.workspace = true

[workspace]
resolver = "3"
members = ["crates/core", "crates/pty", "crates/workspace", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Internal crates
x8ai-core = { path = "crates/core" }
x8ai-pty = { path = "crates/pty" }
x8ai-workspace = { path = "crates/workspace" }

# Tauri (desktop host). Tauri 3 is alpha; stay on the 2.x stable line.
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
# Native folder picker for "Open Folder". Only its Rust API is used; none of its
# webview commands are granted (see docs/decisions/0009).
tauri-plugin-dialog = "2"

# Serialization of IPC contracts and integration definitions.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error types. Already in Tauri's dependency tree.
thiserror = "2"

# URL validation for provider/MCP endpoints. Already in Tauri's dependency tree.
url = "2"

# PTY allocation and process spawning (WezTerm's PTY crate). See ADR 0006.
portable-pty = "0.9"

# Safe process-group signals for terminal teardown. Pinned to the major version
# portable-pty already builds, so it adds no second copy; only `signal` is enabled.
nix = { version = "0.28", default-features = false, features = ["signal"] }

# Workspace filesystem boundary (see docs/decisions/0009).
# Capability-based filesystem access: every operation is resolved beneath the
# workspace root, and symlinks cannot escape it.
cap-std = "4"
# Filesystem change notifications (FSEvents on macOS, inotify on Linux).
notify = "8"
# Directory walking that respects .gitignore, for quick open (from ripgrep).
ignore = "0.4"
# Move deleted entries to the Trash. Default features off: chrono is not needed.
trash = { version = "5", default-features = false }
# Workspace-wide text search: ripgrep's searcher (binary detection, line
# iteration) and literal matcher, so search behaves like `rg`. regex and memchr
# are already in the tree; new transitively: encoding_rs(_io), memmap2 (memory
# maps are left off) and simdutf8.
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"

# macOS only: Objective-C runtime calls, to handle quit from the Dock and logout
# (see src-tauri/src/macos.rs). Already in the tree through Tauri's window layer.
objc2 = "0.6"

# Test-only temporary directories.
tempfile = "3"

# Generates TypeScript types from Rust contracts (see docs/decisions/0003).
# `no-serde-warnings`: ts-rs prints a note for every serde attribute it does not
# interpret. The ones we use (try_from/into on string newtypes, deny_unknown_fields)
# do not change the TypeScript shape; review generated diffs when adding new ones.
ts-rs = { version = "12", features = ["no-serde-warnings"] }

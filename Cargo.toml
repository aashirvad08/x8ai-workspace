[workspace]
resolver = "3"
members = ["crates/core", "crates/pty", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Internal crates
x8ai-core = { path = "crates/core" }
x8ai-pty = { path = "crates/pty" }

# Tauri (desktop host). Tauri 3 is alpha; stay on the 2.x stable line.
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }

# Serialization of IPC contracts and integration definitions.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error types. Already in Tauri's dependency tree.
thiserror = "2"

# URL validation for provider/MCP endpoints. Already in Tauri's dependency tree.
url = "2"

# PTY allocation and process spawning (WezTerm's PTY crate). See ADR 0006.
portable-pty = "0.9"

# Safe process-group signals for terminal teardown. Pinned to the major version
# portable-pty already builds, so it adds no second copy; only `signal` is enabled.
nix = { version = "0.28", default-features = false, features = ["signal"] }

# Generates TypeScript types from Rust contracts (see docs/decisions/0003).
# `no-serde-warnings`: ts-rs prints a note for every serde attribute it does not
# interpret. The ones we use (try_from/into on string newtypes, deny_unknown_fields)
# do not change the TypeScript shape; review generated diffs when adding new ones.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
